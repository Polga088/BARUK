# Production / test live VPS
services:
  postgres:
    image: postgres:16-alpine
    container_name: baruk-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: baruk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: baruk
    volumes:
      - baruk_pg_prod:/var/lib/postgresql/data
    networks:
      - baruk-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baruk -d baruk"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        APP: web
    container_name: baruk-web-prod
    restart: unless-stopped
    environment: &app-env
      NODE_ENV: production
      DATABASE_URL: postgresql://baruk:${POSTGRES_PASSWORD}@postgres:5432/baruk?schema=public
      AUTH_SECRET: ${AUTH_SECRET}
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
      NEXT_PUBLIC_BRANCH_SLUG: ${NEXT_PUBLIC_BRANCH_SLUG:-casablanca-centre}
      NEXT_PUBLIC_ORG_SLUG: ${NEXT_PUBLIC_ORG_SLUG:-baruk}
      NEXT_PUBLIC_OWNER_URL: ${NEXT_PUBLIC_OWNER_URL}
      NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL}
      NEXT_PUBLIC_STAFF_URL: ${NEXT_PUBLIC_STAFF_URL}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8090}:3000"
    networks:
      - baruk-internal

  owner:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        APP: owner
    container_name: baruk-owner-prod
    restart: unless-stopped
    environment:
      <<: *app-env
      AUTH_URL: ${OWNER_URL}
      NEXTAUTH_URL: ${OWNER_URL}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${OWNER_PORT:-8091}:3000"
    networks:
      - baruk-internal

  admin:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        APP: admin
    container_name: baruk-admin-prod
    restart: unless-stopped
    environment:
      <<: *app-env
      AUTH_URL: ${ADMIN_URL}
      NEXTAUTH_URL: ${ADMIN_URL}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ADMIN_PORT:-8092}:3000"
    networks:
      - baruk-internal

  staff:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        APP: staff
    container_name: baruk-staff-prod
    restart: unless-stopped
    environment:
      <<: *app-env
      AUTH_URL: ${STAFF_URL}
      NEXTAUTH_URL: ${STAFF_URL}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${STAFF_PORT:-8093}:3000"
    networks:
      - baruk-internal

volumes:
  baruk_pg_prod:

networks:
  baruk-internal:
    driver: bridge
